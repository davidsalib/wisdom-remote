<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0805">
<title>Wise or Not Wise · Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse 80% 55% at 50% 42%, rgba(212,171,85,.18), transparent 70%), #0d0805;
    color: #f1e6cc; font-family: "Cormorant Garamond", Georgia, serif;
    overflow: hidden; overscroll-behavior: none; user-select: none;
    display: flex; flex-direction: column; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  h1 {
    margin: 0; font: 700 18px "Cinzel", Georgia, serif; letter-spacing: .16em; text-transform: uppercase;
    background: linear-gradient(180deg, #fff3cf, #d4ab55 55%, #8a6a2a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 em { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .meta { display: flex; justify-content: space-between; width: min(84vw, 38vh); margin-top: 6px; height: 20px;
    font: 500 13px "Cinzel", Georgia, serif; letter-spacing: .12em; color: rgba(226,210,173,.6); }
  .meta #score { color: #f3d88f; }
  .timer { width: min(84vw, 38vh); height: 5px; margin: 8px 0 4px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .timer div { height: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #8a6a2a, #d4ab55, #f3d88f); }
  .secs { font: 700 20px "Cinzel", Georgia, serif; color: #f3d88f; height: 26px; font-variant-numeric: tabular-nums; }

  .stage { position: relative; flex: 1; width: 100%; display: grid; place-items: center; min-height: 0; }
  .card {
    position: relative; width: min(84vw, 38vh); padding: 10px 10px 14px; border-radius: 12px;
    background: linear-gradient(170deg, #f4ead3, #dfcca3); color: #3a2410;
    box-shadow: 0 0 0 1px rgba(138,106,42,.7), 0 0 0 6px rgba(212,171,85,.14), 0 30px 60px -20px rgba(0,0,0,.9), 0 0 80px rgba(212,171,85,.18);
    touch-action: none; cursor: grab; will-change: transform;
  }
  .card[hidden] { display: none; }
  .art { position: relative; aspect-ratio: 4 / 5; border-radius: 7px; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #e9c874, #b48a3a 45%, #5b3f17); box-shadow: inset 0 0 0 2px #d4ab55; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .card h2 { margin: 10px 4px 0; text-align: center; font: 700 18px/1.2 "Cinzel", Georgia, serif; letter-spacing: .04em; }
  .card p { margin: 6px 4px 0; text-align: center; font-size: 17px; line-height: 1.25; font-style: italic; color: #4a3420; }
  .stamp { position: absolute; top: 22px; padding: 4px 12px; border-radius: 4px; opacity: 0; pointer-events: none;
    font: 700 22px "Cinzel", Georgia, serif; letter-spacing: .12em; }
  .stamp.wise { right: 20px; color: #f3d88f; border: 2px solid #f3d88f; background: rgba(40,25,5,.6); transform: rotate(12deg); }
  .stamp.not  { left: 20px; color: #f0d6d0; border: 2px solid #f0d6d0; background: rgba(60,10,5,.6); transform: rotate(-12deg); }

  .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 12px;
    font-size: 24px; font-style: italic; color: rgba(241,230,204,.85); pointer-events: none; }
  .msg b { display: block; font: 700 38px "Cinzel", Georgia, serif; font-style: normal; letter-spacing: .12em; margin: 4px 0 6px; }
  .msg .gold { background: linear-gradient(180deg, #fff6d6, #d4ab55 60%, #8a6a2a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .msg .ash { color: #b8aea2; }

  .buttons { display: flex; gap: 12px; width: min(92vw, 460px); margin-top: 14px; }
  .buttons button {
    flex: 1; height: 64px; border-radius: 999px; background: transparent; cursor: pointer;
    font: 700 15px "Cinzel", Georgia, serif; letter-spacing: .15em; text-transform: uppercase;
    transition: transform .1s, background .2s, opacity .2s;
  }
  .buttons button:active { transform: scale(.95); }
  .buttons button:disabled { opacity: .3; cursor: default; }
  #vote-not { color: #c9c0b4; border: 1.5px solid rgba(141,133,122,.6); }
  #vote-wise { color: #f3d88f; border: 1.5px solid rgba(212,171,85,.8); background: rgba(212,171,85,.08); }

  .join { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 24px; background: rgba(13,8,5,.94); }
  .join[hidden] { display: none; }
  .join label { font: 700 16px "Cinzel", Georgia, serif; letter-spacing: .2em; text-transform: uppercase; color: #d4ab55; }
  .join input { width: min(84vw, 360px); height: 56px; padding: 0 18px; border-radius: 12px; border: 1.5px solid rgba(212,171,85,.6);
    background: rgba(255,255,255,.05); color: #f1e6cc; font: 500 22px "Cormorant Garamond", Georgia, serif; text-align: center; outline: none; }
  .join button[type="submit"] { width: min(84vw, 360px); height: 56px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(180deg, #f3d88f, #d4ab55); color: #2a1c10; font: 700 16px "Cinzel", Georgia, serif; letter-spacing: .2em; text-transform: uppercase; }
  .join button[type="submit"]:disabled { opacity: .4; cursor: default; }
  .emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: min(84vw, 360px); margin-bottom: 6px; }
  .emojis button { height: 48px; padding: 0; border-radius: 12px; border: 1.5px solid transparent; background: rgba(255,255,255,.06); font-size: 26px; cursor: pointer; }
  .emojis button[aria-pressed="true"] { border-color: #f3d88f; background: rgba(212,171,85,.25); }
  .msg .big-emoji { display: block; font-size: 72px; line-height: 1; font-style: normal; margin-bottom: 6px; }
  .msg small { display: block; margin-top: 14px; font-size: 16px; opacity: .6; }
  #score { cursor: pointer; }
</style>
</head>
<body>
  <h1>Wise <em>or</em> Not Wise</h1>
  <div class="meta"><span id="progress"></span><span id="score"></span></div>
  <div class="timer"><div id="bar"></div></div>
  <div class="secs" id="secs"></div>

  <div class="stage">
    <div class="card" id="card" hidden>
      <div class="art"><img id="img" alt=""></div>
      <h2 id="title"></h2>
      <p id="desc"></p>
      <div class="stamp wise">Wise</div>
      <div class="stamp not">Not Wise</div>
    </div>
    <div class="msg" id="msg">Connecting…</div>
  </div>

  <div class="buttons">
    <button id="vote-not" disabled>← Not Wise</button>
    <button id="vote-wise" disabled>Wise →</button>
  </div>

  <form class="join" id="join" hidden>
    <label for="name">Your name</label>
    <input id="name" maxlength="20" autocomplete="nickname" placeholder="Name" required>
    <label>Pick your emoji</label>
    <div class="emojis" id="emojis"></div>
    <button type="submit" id="join-btn" disabled>Join</button>
  </form>

<script>
  const LIVE = {
    url: "https://dyyaiufroljbyedqmmjw.supabase.co",
    key: "sb_publishable_rfgOofXqOXcPxBYr4cU7Eg_GVrlUW5v",
    channel: "wisdom-live",
  };
  const VOTE_MS = 7000;
  const $ = (id) => document.getElementById(id);
  const card = $("card"), msg = $("msg");

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  // one id per phone so the host counts one vote each
  let cid = store.get("wisdom-cid");
  if (!cid) { cid = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()); store.set("wisdom-cid", cid); }
  let myName = store.get("wisdom-name") || "";
  let myEmoji = store.get("wisdom-emoji") || "";
  const EMOJIS = ["🦁", "🐑", "🕊️", "🐟", "🦅", "🐂", "🐍", "🌿", "🌳", "🍇", "🍞", "🏺", "🔥", "⭐", "🌙", "☀️", "🌊", "⛰️", "👑", "⚓", "🪔", "🗝️", "📜", "🕯️"];
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  let state = null;   // last state broadcast by the host
  let myVote = null;  // "wise" | "not" for the current round
  let mySecs = 0;     // seconds from the card appearing to this phone's vote
  let deadline = 0;
  let subscribed = false;

  const sb = supabase.createClient(LIVE.url, LIVE.key);
  const ch = sb.channel(LIVE.channel, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "state" }, ({ payload }) => apply(payload));
  ch.subscribe((status) => {
    subscribed = status === "SUBSCRIBED";
    if (subscribed) {
      if (!state) showMsg("Waiting for the host…");
      hello();
    } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
      showMsg("Reconnecting…");
    }
  });

  let lastHello = 0;
  let helloTimer = 0;
  function hello() {
    if (!subscribed || !myName || !myEmoji) return;
    lastHello = Date.now();
    ch.send({ type: "broadcast", event: "hello", payload: { cid, name: myName, emoji: myEmoji } });
  }
  // at most one hello per 2s, but never drop one: if we just said hello, retry when the window ends
  function helloSoon() {
    if (helloTimer) return;
    helloTimer = setTimeout(() => { helloTimer = 0; hello(); }, Math.max(0, 2000 - (Date.now() - lastHello)));
  }

  // join: name + emoji
  let pickedEmoji = myEmoji;
  const syncJoin = () => { $("join-btn").disabled = !$("name").value.trim() || !pickedEmoji; };
  EMOJIS.forEach((em) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = em;
    btn.setAttribute("aria-pressed", String(em === pickedEmoji));
    btn.onclick = () => {
      pickedEmoji = em;
      $("emojis").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      syncJoin();
    };
    $("emojis").appendChild(btn);
  });
  $("name").oninput = syncJoin;
  function openJoin() { $("name").value = myName; syncJoin(); $("join").hidden = false; }
  if (!myName || !myEmoji) openJoin();
  $("join").onsubmit = (e) => {
    e.preventDefault();
    const n = $("name").value.trim().slice(0, 20);
    if (!n || !pickedEmoji) return;
    myName = n;
    myEmoji = pickedEmoji;
    store.set("wisdom-name", n);
    store.set("wisdom-emoji", myEmoji);
    $("join").hidden = true;
    hello();
    render();
  };
  // tap your name to change name/emoji while waiting in the lobby
  $("score").onclick = () => { if (!state || state.status === "lobby" || state.status === "waiting") openJoin(); };

  function apply(s) {
    const newRound = !state || s.roundId !== state.roundId;
    state = s;
    // host (re)loaded and doesn't know this phone yet: announce ourselves so we appear in the members grid
    if (s.scores && !s.scores[cid]) helloSoon();
    if (s.status === "voting") deadline = Date.now() + s.remaining;
    if (newRound) {
      myVote = null;
      resetCard();
    }
    render();
  }

  function resetCard() {
    card.style.transition = "none";
    card.style.transform = "";
    card.style.opacity = 1;
    card.querySelectorAll(".stamp").forEach((s) => (s.style.opacity = 0));
    if (state && state.title) {
      $("title").textContent = state.title;
      $("desc").textContent = state.text || "";
      $("img").style.visibility = "visible";
      $("img").src = state.image || "";
    }
  }

  function showMsg(html) { msg.innerHTML = html; }
  const label = (a) => (a === "wise" ? "Wise" : "Not Wise");

  function render() {
    const s = state;
    const voting = s && s.status === "voting";
    const me = s && s.scores ? s.scores[cid] : null; // [score, gained, rank]
    $("vote-not").disabled = $("vote-wise").disabled = !voting || !!myVote || !myName;
    $("progress").textContent = s && s.total && !["ended", "waiting", "lobby"].includes(s.status) ? `${s.idx + 1} / ${s.total}` : "";
    $("score").textContent = myName ? `${myEmoji} ${myName} · ${me ? me[0] : 0} pts` : "";

    if (!s || s.status === "waiting") {
      card.hidden = true; return showMsg("Waiting for the host…");
    }
    if (s.status === "lobby") {
      card.hidden = true;
      return showMsg(myName && myEmoji
        ? `<div><span class="big-emoji">${esc(myEmoji)}</span><b class="gold">You're in</b>${esc(myName)}, waiting for the host to start…<small>Tap your name above to change it</small></div>`
        : "Enter your name to join");
    }
    if (s.status === "ended") {
      card.hidden = true;
      return showMsg(`<div><b class="gold">✦ Finished ✦</b>Final score<b class="gold">${me ? me[0] : 0}</b>${me ? `Rank #${me[2]} of ${s.players}` : ""}</div>`);
    }
    card.hidden = false;
    if (s.status === "result") {
      fly(s.dir === "right" ? 1 : -1);
      if (myVote) {
        const right = myVote === s.answer;
        return showMsg(right
          ? `<div>Correct!<b class="gold">+${me ? me[1] : 0}</b>The answer is ${label(s.answer)}</div>`
          : `<div>Not quite<b class="ash">+0</b>The answer is ${label(s.answer)}</div>`);
      }
      return showMsg(`<div>The answer is<b class="${s.answer === "wise" ? "gold" : "ash"}">${label(s.answer)}</b></div>`);
    }
    if (s.status === "tie") {
      return showMsg(myVote ? `<div>Votes are tied<b class="gold">Tie</b>The host decides…</div>` : "");
    }
    // voting
    showMsg(myVote ? `<div>Nice, you answered in ${mySecs.toFixed(1)} secs<b class="${myVote === "wise" ? "gold" : "ash"}">${label(myVote)}</b>waiting for the answer…</div>` : "");
  }

  // timer bar
  setInterval(() => {
    const voting = state && state.status === "voting";
    const left = voting ? Math.max(0, deadline - Date.now()) : 0;
    $("bar").style.transform = `scaleX(${left / VOTE_MS})`;
    $("secs").textContent = voting ? Math.ceil(left / 1000) + "s" : state && state.status === "tie" ? "Tie" : "";
  }, 100);

  function vote(choice) {
    if (!state || state.status !== "voting" || myVote || !myName || !myEmoji) return;
    myVote = choice;
    mySecs = Math.max(0, VOTE_MS - Math.max(0, deadline - Date.now())) / 1000;
    ch.send({ type: "broadcast", event: "vote", payload: { roundId: state.roundId, cid, name: myName, emoji: myEmoji, choice } });
    if (navigator.vibrate) navigator.vibrate(25);
    fly(choice === "wise" ? 1 : -1);
    render();
  }

  function fly(sign) {
    if (card.dataset.flown === state.roundId) return;
    card.dataset.flown = state.roundId;
    card.style.transition = "transform .45s cubic-bezier(.5,0,.75,0), opacity .45s";
    card.style.transform = `translateX(${sign * 130}vw) rotate(${sign * 25}deg)`;
    card.style.opacity = 0;
  }

  $("vote-wise").onclick = () => vote("wise");
  $("vote-not").onclick = () => vote("not");

  // swipe to vote
  let startX = null, dx = 0;
  card.addEventListener("pointerdown", (e) => {
    if (!state || state.status !== "voting" || myVote || !myName) return;
    startX = e.clientX; dx = 0;
    card.style.transition = "none";
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener("pointermove", (e) => {
    if (startX === null) return;
    dx = e.clientX - startX;
    card.style.transform = `translateX(${dx}px) rotate(${dx * 0.06}deg)`;
    card.querySelector(".stamp.wise").style.opacity = Math.max(0, Math.min(1, dx / 90));
    card.querySelector(".stamp.not").style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const release = () => {
    if (startX === null) return;
    startX = null;
    if (Math.abs(dx) > 80) return vote(dx > 0 ? "wise" : "not");
    card.style.transition = "transform .3s cubic-bezier(.2,.9,.3,1.3)";
    card.style.transform = "";
    card.querySelectorAll(".stamp").forEach((s) => (s.style.opacity = 0));
  };
  card.addEventListener("pointerup", release);
  card.addEventListener("pointercancel", release);
  $("img").onerror = () => { $("img").style.visibility = "hidden"; };
</script>
</body>
</html>
